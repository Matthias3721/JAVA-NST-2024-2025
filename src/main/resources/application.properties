# ----------------------------------------
# 1. Dane PostgreSQL)
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://db:5432/meddb
spring.datasource.username=app
spring.datasource.password=app

# --------------------------------------------------------
# 2. Ustawienia Hibernate / JPA
# --------------------------------------------------------
# Nie generujemy schematu automatycznie (Flyway)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------
# 3. Flyway (migracje bazy)
# -----------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration

# -----------------------------------
# 4. Ustawienia portu i kontekstu
# -----------------------------------
server.port=8080

# ---------------------------------------
# 5. Spring Security (konfiguracja w klasie SecurityConfig.java)
# ---------------------------------------

# ---------------------------
# 6. Konfiguracja Swagger (Springdoc OpenAPI)
# ---------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ----------------------------------------
# 7. Logowanie
# ----------------------------------------
logging.level.org.springframework=INFO
logging.level.org.example.medmanagement=DEBUG

# ----------------------------------------
# 8. Ustawienia JWT (opcjonalne ? mo?na nadpisa? w ?rodowisku)
# ----------------------------------------
# jwt.secret=secret-key
# jwt.expiration-ms=3600000

# ----------------------------------------
# 9. Inne wlasne wlasciwosci
# ----------------------------------------
# notification.channel.default=EMAIL
